<html>
    <head>

        <title>A-Frame Demo Application</title>

        <!-- This is where we load the framework -->
        <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>

        <!-- Simple Collider Script that can be used -->
        <script src="simple-collider.js"></script>

    </head>
    <body>

        <!-- This is were the magic happens -->
        <a-scene>

            <a-assets>
                <img src="assets/panorama/skybox.jpeg" id="sky">

                <img src="assets/stone/roughness.jpeg" id="stone-r">
                <img src="assets/stone/albedo.jpeg" id="stone-t">
                <img src="assets/stone/normal.jpeg" id="stone-n">

                <img src="assets/sand/albedo.jpeg" id="sand-t">
                <img src="assets/sand/normal.jpeg" id="sand-n">
                <img src="assets/sand/roughness.jpeg" id="sand-r">

                <img src="assets/pavement/albedo.jpeg" id="pavement-t">
                <img src="assets/pavement/normal.jpeg" id="pavement-n">
                <img src="assets/pavement/roughness.jpeg" id="pavement-r">
            </a-assets>

            <a-entity
                id="rig"
                movement-controls="speed: 0.2"
                simple-collider="objects: .collidable; radius: 0.6"
                position="0 0 0">
                <a-entity
                    camera
                    position="0 1.95  0"
                    look-controls>
                </a-entity>
            </a-entity>

            <a-sky src="#sky"></a-sky>

            <!-- Right Box -->
            <a-box  class="collidable"
                    position="2.2 2d -9"
                    rotation="0 0 0"
                    color="#ffffffd"
                    width="4"
                    height="4"
                    depth="4"
                    side="double"

                    src="#stone-t"
                    normal-map="#stone-n"
                    repeat="2 2"
                    normal-texture-repeat="2 2"
                    normal-scale="1 -1"
                    roughness="#stone-r"
            ></a-box>

            <!-- Left Box -->
            <a-box  position="-2.2 2 -9"
                    rotation="0 0 0"
                    width="4"
                    height="4"
                    depth="4"
                    side="double"
                    material="src: #stone-t;
                              normal-map: #stone-n;
                              repeat: 2 2;
                              normal-texture-repeat: 2 2;
                              roughness: #stone-r;"
            ></a-box>

            <a-plane rotation="-90 0 0"
                     scale="10000 10000"
                     material="src: #pavement-t;
                               repeat: 5000 5000;
                               normal-map: #pavement-n;
                               roughness: 0.9;"
            ></a-plane>

        </a-scene>

    </body>
</html>
